name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit and integration tests
        run: uv run pytest tests -v

      - name: Run agent golden evaluation benchmark
        run: uv run python -m evals.runner

      - name: Verify zero unsafe executions and 100% citation grounding
        run: uv run pytest evals/test_evals.py -v
